# Ace Bot dashboard — Nginx reverse proxy (dashboard runs on localhost:3010).
#
# Install:
#   sudo apt install nginx
#   sudo cp deploy/nginx/ace-bot.conf /etc/nginx/sites-available/ace-bot
#   sudo ln -s /etc/nginx/sites-available/ace-bot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Free TLS certificate (Let's Encrypt via Certbot):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d dashboard.blairsvillenetworksolutions.xyz
# Certbot will fill in the ssl_certificate lines for you.
# NOTE: for Certbot's check to reach your server, the domain must resolve
# to your server and ports 80/443 must be forwarded to it (see below).
# If Cloudflare is proxying the record (orange cloud), switch it to
# DNS-only (grey cloud) while Certbot runs, then re-enable the proxy.
#
# After Nginx is up, set in config.json:
#   "dashboard": { "publicUrl": "https://dashboard.blairsvillenetworksolutions.xyz", ... }
# so the OAuth redirect URI and setup/invite links use the domain.
# The dashboard trusts X-Forwarded-Proto (app.set('trust proxy', 1)), so
# secure cookies and rate limiting work correctly behind this proxy.
#
# Network checklist (the 404/521 causes, Nov 15):
#   1. Cloudflare DNS: dashboard.blairsvillenetworksolutions.xyz must point
#      at your public IP (A record).
#   2. ARRIS gateway: forward TCP 80 and 443 to 10.0.0.188 (the bot server).
#   3. On the server: nginx running, this config enabled, Certbot done.
#   4. From your own LAN the public IP won't work (no NAT loopback on the
#      ARRIS) — on your PC add to C:\Windows\System32\drivers\etc\hosts:
#        10.0.0.188  dashboard.blairsvillenetworksolutions.xyz
#      then https://dashboard.blairsvillenetworksolutions.xyz/ works locally.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.blairsvillenetworksolutions.xyz;

    # Redirect plain HTTP to HTTPS. (Certbot adds a /.well-known/ exception
    # here when it runs, so certificate renewals keep working.)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard.blairsvillenetworksolutions.xyz;

    # TLS certificate (replace with your real paths, or let Certbot manage them)
    ssl_certificate     /etc/letsencrypt/live/dashboard.blairsvillenetworksolutions.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.blairsvillenetworksolutions.xyz/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # Headers the dashboard needs (Host, real client IP, protocol)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (future-proofing; dashboard is plain HTTP today)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
