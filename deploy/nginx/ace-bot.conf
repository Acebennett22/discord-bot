# Ace Bot dashboard — Nginx reverse proxy (dashboard runs on localhost:3000).
#
# Install:
#   sudo apt install nginx
#   sudo cp deploy/nginx/ace-bot.conf /etc/nginx/sites-available/ace-bot
#   sudo ln -s /etc/nginx/sites-available/ace-bot /etc/nginx/sites-enabled/
#   # edit server_name + ssl_certificate paths below, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Free TLS certificate (Let's Encrypt via Certbot):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d bot.example.com
# Certbot will fill in the ssl_certificate lines for you.
#
# After Nginx is up, set in config.json:
#   "dashboard": { "publicUrl": "https://bot.example.com", ... }
# so the OAuth redirect URI and setup/invite links use the domain.
# The dashboard trusts X-Forwarded-Proto (app.set('trust proxy', 1)), so
# secure cookies and rate limiting work correctly behind this proxy.

server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    # Redirect plain HTTP to HTTPS (recommended). If you really must serve
    # HTTP only (local testing), delete this server block's return line and
    # use the 443 block's location / as the 80 block instead.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bot.example.com;

    # TLS certificate (replace with your real paths, or let Certbot manage them)
    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Headers the dashboard needs (Host, real client IP, protocol)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (future-proofing; dashboard is plain HTTP today)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
